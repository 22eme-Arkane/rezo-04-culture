<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9d44d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Applique le thème AVANT le premier paint (anti-flash). -->
    <script>
      try {
        var t = localStorage.getItem('rezo-theme')
        document.documentElement.dataset.theme = t || 'soleil-or'
      } catch (e) {
        document.documentElement.dataset.theme = 'soleil-or'
      }
      // Filet de sécurité : si le démarrage échoue (réseau coupé, erreur JS),
      // l'écran d'accueil ne doit JAMAIS rester à masquer l'application.
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b) b.remove()
      }, 8000)
    </script>
    <!--
      Écran d'accueil de l'application. Android en génère déjà un depuis le
      manifeste (fond jaune + icône) mais n'y écrit pas toujours le nom, et iOS
      n'affiche qu'un fond vide. Celui-ci est sous notre contrôle : styles en
      ligne pour qu'il s'affiche AVANT même le chargement de la feuille de
      style, et il reste visible jusqu'à ce que la première vue soit prête.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        background: #f9d44d;
        font-family: 'Poppins', system-ui, sans-serif;
      }
      #boot img { width: 128px; height: 128px; object-fit: contain; }
      #boot span {
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: #064f36;
      }
      #boot.is-done { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
      @media (prefers-reduced-motion: reduce) { #boot.is-done { transition: none; } }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2" />
    <title>Armana</title>
  </head>
  <body>
    <div id="boot">
      <img src="/assets/studio-affiche/masks-logo.png" alt="" />
      <span>Armana</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
