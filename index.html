<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9d44d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Applique le thème AVANT le premier paint (anti-flash). -->
    <script>
      try {
        var t = localStorage.getItem('rezo-theme')
        document.documentElement.dataset.theme = t || 'soleil-or'
      } catch (e) {
        document.documentElement.dataset.theme = 'soleil-or'
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2" />
    <title>Armana</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
